name: 安装或更新问题
description: 反馈初次安装、上传安装包、覆盖更新或回退问题
title: "[安装] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索是否已有相同反馈。此处公开可见，请勿上传账号、密码、验证码、令牌、数据库配置、完整日志或未打码的客户资料。
        可以进入「主题管理 → 版本与兼容 → 复制排查信息」，核对后粘贴。后台无法进入时，填写已知信息和脱敏截图即可。
  - type: input
    id: theme_version
    attributes:
      label: 主题版本
      placeholder: 例如 v17.3 测试版
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统及浏览器
      placeholder: V10 版本、PHP 版本、浏览器及是否手机端
    validations:
      required: true
  - type: dropdown
    id: operation
    attributes:
      label: 当前操作
      options:
        - 首次安装
        - 后台上传安装包
        - 确认覆盖更新
        - 服务器本地导入
        - 回退
    validations:
      required: true
  - type: input
    id: previous_version
    attributes:
      label: 原版本与安装包名称
      description: 首次安装填写「首次安装」；更新请填写旧版本及上传的 ZIP 文件名。
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 写明操作入口与步骤；页面只写相对地址，不必提供站点域名。
      placeholder: |
        1. 打开……
        2. 点击或修改……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际表现
      description: 可附打码截图；请说明是否每次都发生，以及刷新后是否恢复。
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 排查信息（可选）
      description: 粘贴主题后台生成的排查信息；请勿粘贴完整配置或日志。报错可以仅提供错误编号。
      render: text
