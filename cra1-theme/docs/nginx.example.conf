# Include inside the site's existing server {}. Document root must be V10/public.
# Do not replace V10 routing, TLS, PHP handlers or vendor security rules.
location ~* ^/(?:public/)?(?:cra1-theme|runtime|config|lib|vendor|app|route|tests|bin)(?:/|$) { return 404; }
location ~ (^|/)\. { return 404; }
location ~* ^/(?:web/cra1/(?:controller|src)/|cra1-shared/(?:src|tests|theme-sources|previews)/|cra1-shared/(?:icons|cart-links)\.php$) { return 404; }
location ~* ^/cra1-shared/(?:build[^/]*\.(?:mjs|py)|package[^/]*\.json|[^/]+\.md)$ { return 404; }
# Static CRA1 assets use immutable versions; no date/version whitelist is needed.
# <theme-admin-entry> must be replaced by the entry chosen in the installer.
# Place these regex locations before a broader PHP/static regex in existing config.
location = /<theme-admin-entry> { return 302 /<theme-admin-entry>/index.php$is_args$args; }
location = /<theme-admin-entry>/ { return 302 /<theme-admin-entry>/index.php$is_args$args; }
location ~ ^/<theme-admin-entry>/(?:assets/releases/[a-z0-9-]+/(?:chunks/)?[A-Za-z0-9_.-]+\.(?:js|css)|login\.js|security-login\.css|preview-runtime\.js)$ {
    try_files $uri =404;
    add_header X-Content-Type-Options nosniff always;
}
location ~ ^/<theme-admin-entry>/(?!index\.php$|login\.php$|preview\.php$) { return 404; }
# upload/cra1-theme allows only the media formats accepted by the theme.
location ~* ^/upload/cra1-theme/.*\.(?:php[0-9]?|phtml|phar|html?|js|json|sqlite|key)$ { return 404; }
