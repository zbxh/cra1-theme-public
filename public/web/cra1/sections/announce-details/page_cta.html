{if ( !isset($data.cra1.show_page_cta) || $data.cra1.show_page_cta == 1 ) }
        <section class="band border-y border-white/60 bg-white/50 py-12 md:py-16" data-reveal aria-label="继续了解">
            <div class="container-page">
                <h2 class="section-title">继续了解</h2>
                <div class="mt-8 grid gap-4 md:grid-cols-3">
                    {foreach $data.cra1.page_cta as $row}
                    <a href="{$row.url|default='/'}" class="feature-item glass-card group rounded-xl p-6 lift-card cui-card">
                        <h3 class="font-semibold text-ink group-hover:text-primary">{$row.name}</h3>
                        <p class="mt-2 text-sm leading-6 text-body">{$row.desc}</p>
                        <span class="card-arrow mt-4 inline-block text-sm text-primary">进入 <span aria-hidden="true">→</span></span>
                    </a>
                    {/foreach}
                </div>
            </div>
        </section>
        {/if}
