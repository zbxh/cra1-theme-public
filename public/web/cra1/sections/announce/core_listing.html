<section class="content-list-section container-page py-12 md:py-16" data-reveal>
            <div>
                <div x-ref="listBody" class="article-list compact-article-list" x-cloak x-show="!loading">
                    <template x-for="item in items" :key="item.id">
                        <article data-enter-item class="article-card cui-card">
                            <a :href="'/announce-details.html?id=' + item.id" class="group flex items-center justify-between gap-5 p-5 md:p-6">
                                <div class="min-w-0">
                                    <h2 class="truncate text-base font-semibold text-ink group-hover:text-primary" x-text="item.title"></h2>
                                    <p class="mt-2 text-sm text-muted" x-text="timeText(item.create_time)"></p>
                                </div>
                                <span class="card-arrow shrink-0 text-sm text-primary" aria-hidden="true">→</span>
                            </a>
                        </article>
                    </template>
                </div>

                <div x-cloak x-show="!loading && !loadFailed && items.length === 0" class="empty-state content-empty text-center"><svg class="empty-symbol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M5 4h14v16H5ZM8 8h8M8 12h8m-8 4h5"/></svg><p>{if ( cra1_content_explicit($data.cra1, 'core_listing_copy.announce_empty') || (( isset($data.cra1.core_listing_copy['announce_empty']) && $data.cra1.core_listing_copy['announce_empty'] )) ) }{$data.cra1.core_listing_copy['announce_empty']}{else /}暂无公告{/if}</p><a class="empty-link" href="/document.html">查找帮助文档 →</a></div>
                <div x-cloak x-show="loading" class="article-list compact-article-list" aria-live="polite" aria-label="公告加载中">
                    <div class="article-card glass-card p-6 cui-card"><div class="skeleton-line h-5 w-3/4"></div><div class="skeleton-line mt-3 h-3 w-24"></div></div>
                    <div class="article-card glass-card p-6 cui-card"><div class="skeleton-line h-5 w-2/3"></div><div class="skeleton-line mt-3 h-3 w-24"></div></div>
                    <div class="article-card glass-card p-6 cui-card"><div class="skeleton-line h-5 w-4/5"></div><div class="skeleton-line mt-3 h-3 w-24"></div></div>
                </div>

                <div x-cloak x-show="!loading && loadFailed" class="empty-state content-empty text-center" role="status"><p>页面错误，请刷新重试</p></div>
                <nav class="pagination-bar mt-8 flex items-center justify-center gap-4" x-cloak x-show="!loading && total > limit" aria-label="公告分页">
                    <button type="button" class="btn btn-sm btn-outline btn-primary cui-button cui-button--outline cui-button--sm" :disabled="page <= 1" @click="prev()">{if ( cra1_content_explicit($data.cra1, 'core_listing_copy.txt6') || (( isset($data.cra1.core_listing_copy['txt6']) && $data.cra1.core_listing_copy['txt6'] )) ) }{$data.cra1.core_listing_copy['txt6']}{else /}上一页{/if}<span class="cui-arrow" data-cui-arrow aria-hidden="true">↗</span></button>
                    <span class="text-sm text-muted" aria-live="polite">第 <span x-text="page"></span> 页</span>
                    <button type="button" class="btn btn-sm btn-outline btn-primary cui-button cui-button--outline cui-button--sm" :disabled="page * limit >= total" @click="next()">{if ( cra1_content_explicit($data.cra1, 'core_listing_copy.txt7') || (( isset($data.cra1.core_listing_copy['txt7']) && $data.cra1.core_listing_copy['txt7'] )) ) }{$data.cra1.core_listing_copy['txt7']}{else /}下一页{/if}<span class="cui-arrow" data-cui-arrow aria-hidden="true">↗</span></button>
                </nav>
            </div>
        </section>
